# ============================================================
# Campaign 配置文件 — 纯方向定义
# 执行参数（翻页数、JD 上限、排序等）在 profiles/search_config.yaml 中管理。
# 画像切换通过侧边栏或 profiles/.current_user 完成。
# ============================================================

# ── 使用的评分策略（指向 instances/strategies/ 下的文件名）──
strategy: "web3"

# ── 搜索关键词组（每组可指定 keywords + location）──
search_queries:
  - keywords: "Web3"
    location: "Hong Kong"
  - keywords: "Blockchain Developer"
    location: "Hong Kong"
  - keywords: "Smart Contract"
    location: "Hong Kong"
