    highlights:
      - "从初级后端开发成长为项目实际负责人，拥有 WaaS 支付系统全模块 ownership"
      - "充值监听（五层防假充值）、提款处理（五层防重复出款 + MPC 三方状态机）"
      - "归集调度（三阶段流水线 + 归集-提款互斥）、商户 API 对接、AML 合规集成"
      - "经历过假充值攻击、节点故障、重复出款事故等生产事件，具备真实排障和优化经验"
