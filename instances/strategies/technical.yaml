# ============================================================
# 策略配置 — 通用技术开发方向
# 适用于 Developer, Engineer, Programmer,
# Backend, Frontend, Fullstack 等岗位。
# ============================================================

weight_profile:
  skill: 35       # 技术岗对具体技能匹配度要求最高
  experience: 20  # 工作年限是硬性筛选条件之一
  level: 15       # 职级对标（Junior/Mid/Senior）
  industry: 15    # 行业背景权重适中，技术岗更看重技术栈
  bonus: 15       # 证书、开源贡献等

weight_rules_keywords:
  - "developer"
  - "engineer"
  - "programmer"
  - "backend"
  - "frontend"
  - "fullstack"
  - "full-stack"
  - "software"
  - "devops"

min_match_score: 45
borderline_rescore: true
borderline_range: 8
top_n: 999
