# ============================================================
# 用户画像字段定义 (User Field Schema)
# 驱动前端动态表单渲染，后端数据校验
# ============================================================
#
# 结构说明:
#   groups: 字段分组，对应设置面板的卡片顺序
#     - key: 分组标识
#       label: 卡片标题
#       fields: 该组内的字段列表
#         - key: 字段在 YAML 中的键名
#           label: 在界面上的显示名称
#           type: 数据类型 (string, number, boolean, object, array, map)
#           widget: 使用的编辑控件 (input, textarea, number, toggle, select, object, table, tags, list, categories, chips)
#           editable: 是否可编辑 (默认 true)
#           options: 下拉框的选项列表 (widget=select 时)
#           columns: 表格的列定义 (widget=table 时)
#           fields: 子字段定义 (type=object 时)
#           item_schema: 动态分类项的 schema (type=map 时)
#  注: 当前版本暂不开放深层嵌套编辑 (work_experience[].key_achievements, core_modules)，
#       它们将继续通过只读展示 + YAML 编辑方式修改。

groups:
  # ── 基本信息 ──
  - key: basic_info
    label: 基本信息
    fields:
      - key: name
        label: 姓名
        type: string
        widget: input
      - key: name_en
        label: 英文名
        type: string
        widget: input
      - key: location
        label: 所在地
        type: string
        widget: input
      - key: phone
        label: 电话
        type: string
        widget: input
      - key: email
        label: 邮箱
        type: string
        widget: input
      - key: linkedin
        label: LinkedIn
        type: string
        widget: input
      - key: github
        label: GitHub
        type: string
        widget: input

  # ── 香港身份 ──
  - key: hk_status
    label: 香港身份
    fields:
      - key: hk_permanent_resident
        label: 香港永久居民
        type: boolean
        widget: toggle

  # ── 求职意向 ──
  - key: job_intent
    label: 求职意向
    fields:
      - key: target_titles
        label: 目标岗位
        type: array
        widget: textarea       # 每行一个岗位名称
      - key: target_industries
        label: 目标行业
        type: array
        widget: input          # 逗号分隔
      - key: job_type
        label: 工作类型
        type: string
        widget: select
        options:
          - full-time
          - part-time
          - contract
          - freelance
      - key: salary_expectation
        label: 薪资期望
        type: object
        widget: object
        fields:
          - key: min
            label: 最低薪资
            type: number
            widget: number
          - key: max
            label: 最高薪资
            type: number
            widget: number
          - key: currency
            label: 币种
            type: string
            widget: select
            options:
              - HKD
              - USD
              - CNY
          - key: note
            label: 薪资备注
            type: string
            widget: textarea
      - key: notice_period
        label: 到岗时间
        type: string
        widget: input
      - key: location_preference
        label: 目标城市
        type: array
        widget: textarea       # 每行一个城市

  # ── 战略定位 ──
  - key: strategic_positioning
    label: 战略定位
    fields:
      - key: strategic_positioning
        label: 核心画像
        type: string
        widget: textarea

  # ── 工作经历 ──
  - key: work_experience
    label: 工作经历
    type: array
    widget: table
    columns:
      - key: company
        label: 公司
        type: string
        widget: input
      - key: title
        label: 职位
        type: string
        widget: input
      - key: period
        label: 时间段
        type: string
        widget: input
      - key: overview
        label: 工作概述
        type: string
        widget: textarea
      - key: tech_stack
        label: 技术栈
        type: array
        widget: tags
      - key: highlights
        label: 工作亮点
        type: array
        widget: list
    # 深层嵌套暂不开放编辑 (key_achievements, core_modules 等)

  # ── 教育背景 ──
  - key: education
    label: 教育背景
    type: array
    widget: table
    columns:
      - key: degree
        label: 学位
        type: string
        widget: input
      - key: major
        label: 专业
        type: string
        widget: input
      - key: school
        label: 学校
        type: string
        widget: input
      - key: period
        label: 时间段
        type: string
        widget: input

  # ── 项目经历 ──
  - key: projects
    label: 项目经历
    type: array
    widget: table
    columns:
      - key: name
        label: 项目名
        type: string
        widget: input
      - key: role
        label: 角色
        type: string
        widget: input
      - key: tech_stack
        label: 技术栈
        type: array
        widget: tags
      - key: description
        label: 描述
        type: string
        widget: textarea
      - key: resume_bullets
        label: 简历要点
        type: array
        widget: subtable
        columns:
          - key: id
            label: ID
            type: string
            widget: input
          - key: text
            label: 文本
            type: string
            widget: textarea

  # ── 证书 ──
  - key: certifications
    label: 证书
    type: array
    widget: chips

  # ── 专业技能 ──
  - key: skills
    label: 专业技能
    type: map
    widget: categories
    item_schema:
      type: array
      columns:
        - key: name
          label: 技能名
          type: string
          widget: input
        - key: level
          label: 熟练度
          type: string
          widget: select
          options:
            - 精通
            - 熟练
            - 掌握
            - 了解
        - key: years
          label: 年数
          type: number
          widget: number
        - key: detail
          label: 说明
          type: string
          widget: input

  # ── 自我评价 ──
  - key: summary
    label: 自我评价
    fields:
      - key: summary
        label: 自我评价
        type: string
        widget: textarea
