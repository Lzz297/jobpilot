llm:
  provider: deepseek
  model: deepseek-v4-pro

sort_mode: "date"

search_queries:
  - keywords: "Developer"
    location: "Hong Kong"

filters:
  exclude_companies: []

max_pages_per_query: 1
max_total_results: 5

matching:
  min_match_score: 45
  top_n: 999
  borderline_rescore: false
  borderline_range: 8
  weight_profiles:
    default:
      skill: 30
      experience: 25
      level: 15
      industry: 15
      bonus: 15
  weight_rules: {}

market_job_categories: []
market_classifications: []

market_analysis:
  max_pages: 1
  max_fetch_jd: 3
  batch_size: 3
  jd_max_chars: 2000
